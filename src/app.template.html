<title>EAASI Ops Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>/*__LEAFLET_CSS__*/</style>
<style>
/* Layout: member app — rail + main on desktop, top bar + bottom tabs on phone. Freshness stamp on every record is the signature. */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface-2:#F5F8FF; --ink:#1A2340; --text:#2C3E50; --muted:#56647E; --line:#D5DEEC;
  --teal:#3DBFBF; --teal-ink:#1C7A7A; --teal-wash:#E0F4F4; --navy:#1A2340; --navy-2:#2B3A67;
  --ok:#27702A; --ok-wash:#E4F1E4; --warn:#8C6200; --warn-wash:#FAF0D6; --bad:#A93628; --bad-wash:#F8E4E0;
  --chat-bg:#E4EBF2; --bubble-in:#FFFFFF; --bubble-out:#D6F0F0; --plate:#FFFFFF; --sea:#DCE6F0; --land:#F8FAFD; --border-land:#B9C7DA;
  --cloud-filter:invert(1) contrast(1.6) brightness(1.05); --cloud-blend:multiply; --osm-filter:saturate(.35) brightness(1.02);
  --f-body:Calibri,"Carlito","Segoe UI",system-ui,sans-serif; --f-code:"Barlow Condensed","Arial Narrow",Calibri,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(26,35,64,.06),0 4px 14px rgba(26,35,64,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1528; --surface:#161F3A; --surface-2:#1C2747; --ink:#E9EEF8; --text:#CAD3E4; --muted:#93A1BC; --line:#2A3760;
  --teal:#45C9C9; --teal-ink:#72D9D9; --teal-wash:#15384A; --navy:#0B1122; --navy-2:#22305A;
  --ok:#74C274; --ok-wash:#16301F; --warn:#E3B650; --warn-wash:#382C10; --bad:#F08476; --bad-wash:#3B1C1A;
  --chat-bg:#0B1122; --bubble-in:#1C2747; --bubble-out:#14424A; --plate:#FFFFFF; --sea:#0A1020; --land:#18223F; --border-land:#33436F;
  --cloud-filter:contrast(1.6) brightness(.95); --cloud-blend:screen; --osm-filter:invert(1) hue-rotate(180deg) saturate(.35) brightness(.78) contrast(.95);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1528; --surface:#161F3A; --surface-2:#1C2747; --ink:#E9EEF8; --text:#CAD3E4; --muted:#93A1BC; --line:#2A3760;
  --teal:#45C9C9; --teal-ink:#72D9D9; --teal-wash:#15384A; --navy:#0B1122; --navy-2:#22305A;
  --ok:#74C274; --ok-wash:#16301F; --warn:#E3B650; --warn-wash:#382C10; --bad:#F08476; --bad-wash:#3B1C1A;
  --chat-bg:#0B1122; --bubble-in:#1C2747; --bubble-out:#14424A; --plate:#FFFFFF; --sea:#0A1020; --land:#18223F; --border-land:#33436F;
  --cloud-filter:contrast(1.6) brightness(.95); --cloud-blend:screen; --osm-filter:invert(1) hue-rotate(180deg) saturate(.35) brightness(.78) contrast(.95);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--teal-ink)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3{color:var(--ink);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.55rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
.code{font-family:var(--f-code);font-weight:700;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-ink);font-weight:700}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}
.plate{background:var(--plate);border-radius:8px;display:inline-flex;align-items:center;padding:6px 10px}
.plate img{height:34px;width:auto;display:block}
.rail .product{margin:10px 4px 18px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;color:var(--text)}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--teal-wash);color:var(--ink);font-weight:700}
.nav svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto}
.rail .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid var(--line);font-size:.86rem}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy-2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.topbar{display:none}
.tabbar{display:none}
main{min-width:0;padding:28px 32px 60px;max-width:1080px;width:100%}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;display:inline-grid;place-items:center}

@media (max-width:900px){
  .app{display:block}
  .rail{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .plate img{height:24px}
  .topbar .t{font-weight:700;color:var(--ink);font-size:.95rem}
  .topbar .avatar{width:28px;height:28px}
  .topbar .themebtn{margin-left:auto;padding:5px 8px}
  .topbar .themebtn span{display:none}
  main{padding:18px 16px 96px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--muted);padding:4px 0;position:relative}
  .tabbar button[aria-current="page"]{color:var(--teal-ink);font-weight:700}
  .tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;font-size:.65rem}
}

/* generic blocks */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin-top:4px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.section{margin-top:28px}
.section>.eyebrow{display:block;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--teal);background:var(--teal);color:#062C2C;font-weight:700;padding:8px 14px;border-radius:8px;font-size:.9rem}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--teal-ink)}
.btn.quiet{background:var(--surface-2);border-color:var(--line);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag.teal{background:var(--teal-wash);color:var(--teal-ink);border-color:transparent}
.tag.ok{background:var(--ok-wash);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-wash);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-wash);color:var(--bad);border-color:transparent}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0;flex:1 1 220px;max-width:340px}
.search input{border:0;background:transparent;outline:0;font:inherit;color:var(--ink);width:100%;min-width:0}
.search svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;margin-bottom:16px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:8px;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.9rem}
.seg button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* freshness stamp — signature */
.stamp{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);min-width:0}
.ticks{display:grid;grid-template-columns:repeat(12,4px);gap:2px;flex:none}
.ticks i{height:10px;border-radius:1px;background:var(--line)}
.stamp.ok .ticks i.on{background:var(--ok)}
.stamp.warn .ticks i.on{background:var(--warn)}
.stamp.bad .ticks i.on{background:var(--bad)}
.stamp.new .ticks i{background:transparent;border:1px dashed var(--line)}
.stamp b{color:var(--text);font-weight:700}
.stamp span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* home */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.kpi .v{font-size:2rem;font-weight:700;color:var(--ink);line-height:1}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.teal .v{color:var(--teal-ink)}
.kpi .l{font-size:.86rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.qitem{padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--warn)}
.qitem.sys{border-left-color:var(--bad)}
.qitem .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qitem .diff{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:.88rem}
.qitem .diff dt{color:var(--muted)} .qitem .diff dd{margin:0;min-width:0;overflow-wrap:anywhere}
.qitem .diff .new{color:var(--ok);font-weight:700}
.wa{background:var(--chat-bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.wa .from{font-size:.74rem;color:var(--muted);text-align:center}
.bub{max-width:88%;padding:8px 11px 6px;border-radius:10px;background:var(--bubble-in);box-shadow:0 1px 1px rgba(0,0,0,.08);font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.out{align-self:flex-end;background:var(--bubble-out)}
.bub .meta{display:block;text-align:right;font-size:.7rem;color:var(--muted);margin-top:2px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.mod{padding:14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);display:flex;flex-direction:column;gap:4px}
.mod:hover{border-color:var(--teal)}
.mod b{color:var(--ink)}
.mod .n{font-size:1.4rem;font-weight:700;color:var(--teal-ink)}

/* lists */
.list{display:flex;flex-direction:column}
.list>.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.list>.item:last-child{border-bottom:0}
.list>.item:hover{background:var(--surface-2)}
.cc{width:52px;height:40px;border-radius:6px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--f-code);font-weight:700;font-size:1.3rem;letter-spacing:.04em}
.cc.icao{font-size:1.05rem;background:var(--navy-2)}
.item .main{display:flex;flex-direction:column;gap:5px;min-width:0}
.item .title{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .title b{color:var(--ink);font-size:1.02rem}
.item .facts{display:flex;gap:6px;flex-wrap:wrap}
.item .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.lead{font-size:1.15rem;font-weight:700;color:var(--ink)}
@media (max-width:640px){
  .list>.item{grid-template-columns:44px minmax(0,1fr);gap:12px}
  .cc{width:44px;height:36px;font-size:1.1rem}
  .item .side{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;text-align:left}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* radar */
.rad{padding:16px;display:flex;flex-direction:column;gap:8px}
.rad.flag{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset,var(--shadow)}
.rad .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rad .date{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);font-size:.86rem}
.rad h3{font-size:1.02rem}
.rad .impact{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:.9rem}
.rad .impact b{color:var(--ink)}
.pipeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.pipeline div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.84rem}
.pipeline b{display:block;color:var(--ink)}
@media (max-width:640px){.pipeline{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.sheet header{display:flex;gap:12px;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet header .x{margin-left:auto;background:none;border:0;padding:6px;border-radius:6px}
.sheet header .x svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
.sheet .body>*{flex-shrink:0}
.sheet .body{overflow-y:auto;padding:18px 18px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.facts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts-grid div{background:var(--surface);padding:10px 12px;min-width:0}
.facts-grid dt{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.facts-grid dd{margin:2px 0 0;color:var(--ink);font-weight:700;overflow-wrap:anywhere}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.block h3{margin-bottom:8px;font-size:.95rem}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.contacts{display:flex;flex-direction:column;gap:0}
.contact{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.contact:last-child{border-bottom:0}
.contact span:first-child{color:var(--muted);font-size:.82rem}
.contact .val{overflow-wrap:anywhere;user-select:all;color:var(--ink)}
.callout{border-radius:var(--r);padding:12px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.callout.warn{background:var(--warn-wash);color:var(--text);border:1px solid var(--warn)}
.callout.bad{background:var(--bad-wash);border:1px solid var(--bad)}
.callout.teal{background:var(--teal-wash);border:1px solid var(--teal)}
.callout b{color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.form{display:flex;flex-direction:column;gap:8px}
.form label{font-size:.8rem;color:var(--muted);font-weight:700}
.form select,.form input,.form textarea{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.zones{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.zones div{display:flex;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:.88rem}
.zones div:last-child{border-bottom:0}
.zones .code{color:var(--teal-ink);min-width:54px}
.mapbox{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.srcs{display:flex;flex-direction:column;gap:4px;font-size:.86rem}
.srcs a{overflow-wrap:anywhere}

/* assistant */
.chatwrap{max-width:520px;margin:0 auto;height:calc(100vh - 88px);display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--navy);color:#fff}
.chathead .dot{width:36px;height:36px;border-radius:50%;background:var(--plate);display:grid;place-items:center;flex:none;overflow:hidden}
.chathead .dot img{width:30px;height:auto}
.chathead small{display:block;color:#A9B6CF;font-size:.76rem}
.chathead .mode{margin-left:auto;font-size:.72rem;background:rgba(255,255,255,.12);padding:3px 8px;border-radius:999px}
.chat>*{flex-shrink:0}
.chat{flex:1;overflow-y:auto;background:var(--chat-bg);padding:14px;display:flex;flex-direction:column;gap:8px}
.refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.refs button{border:1px solid var(--teal);background:transparent;color:var(--teal-ink);border-radius:999px;font-size:.76rem;padding:2px 9px;font-weight:700}
.sent{align-self:center;max-width:92%;background:var(--warn-wash);border:1px solid var(--warn);border-radius:10px;padding:8px 12px;font-size:.84rem}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.suggest{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line)}
.suggest button{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:.8rem;color:var(--text)}
.composer{display:flex;gap:8px;padding:10px;background:var(--surface);border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;font:inherit;border:1px solid var(--line);border-radius:20px;padding:9px 14px;background:var(--surface-2);color:var(--ink);max-height:120px;min-width:0}
.composer button{width:42px;height:42px;border-radius:50%;border:0;background:var(--teal);display:grid;place-items:center;flex:none}
.composer button svg{width:20px;height:20px;fill:#062C2C}
@media (max-width:900px){.chatwrap{height:calc(100vh - 150px);border-radius:12px}}

/* map */
.mapwrap{position:relative;height:calc(100vh - 170px);min-height:460px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{font-family:var(--f-body);background:var(--sea)}
.leaflet-control-attribution{background:var(--surface)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--teal-ink)!important}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}
.pin{font-family:var(--f-code);font-weight:700;font-size:12px;letter-spacing:.03em;background:var(--teal);color:#062C2C;border:1.5px solid var(--navy);border-radius:4px;padding:1px 4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25);transform:translate(-50%,-50%);display:inline-block}
.pin.sel{background:var(--ink);color:var(--bg);border-color:var(--teal)}
.mropin{display:block;width:13px;height:13px;background:var(--navy-2);border:2px solid var(--plate);transform:translate(10px,4px) rotate(45deg);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.mropin.sel{background:var(--teal)}
.ptpin{display:block;width:14px;height:14px;border-radius:50%;background:var(--warn);border:2px solid var(--plate);transform:translate(-50%,-50%)}
.mlayers{position:absolute;top:10px;left:56px;right:10px;z-index:500;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.mlayers .chip{pointer-events:auto;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px}
.mlayers .chip:disabled{opacity:.55;cursor:not-allowed}
.key{width:10px;height:10px;border-radius:2px;display:inline-block}
.mstatus{position:absolute;left:10px;bottom:22px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.78rem;color:var(--muted);box-shadow:var(--shadow);max-width:calc(100% - 20px)}
.mstatus b{color:var(--ink)}
.mpanel{position:absolute;top:56px;right:10px;bottom:10px;width:360px;z-index:600;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}
.mpanel header{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.mpanel header .x{margin-left:auto;background:none;border:0;padding:4px}
.mpanel header .x svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}
.mpanel .body{overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
.mpanel .body>*{flex-shrink:0}
@media (max-width:900px){
  .mapwrap{height:calc(100vh - 200px);min-height:420px}
  .mpanel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:62%;border-radius:14px 14px 0 0}
  .mlayers{left:52px}
}
.metar{font-family:ui-monospace,Consolas,monospace;font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;color:var(--ink)}
.fltcat{font-weight:700;font-size:.74rem;padding:2px 7px;border-radius:4px;color:#fff}
.fltcat.VFR{background:#2A7A2A}.fltcat.MVFR{background:#2461B8}.fltcat.IFR{background:#B03A2E}.fltcat.LIFR{background:#8A2A8A}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:2px;font-size:.8rem}
.day b{color:var(--ink);font-size:.84rem}
.day .clear{font-size:1.35rem;font-weight:700;line-height:1.1}
.day .clear.good{color:var(--ok)} .day .clear.some{color:var(--warn)} .day .clear.none{color:var(--bad)}
.strip{display:grid;grid-template-columns:repeat(72,1fr);gap:1px;height:34px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px}
.strip i{display:block;border-radius:1px}
.strip i.night{opacity:.25}
.striplab{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);align-items:center}
.near{display:flex;flex-direction:column}
.near button{display:flex;gap:8px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:7px 0;text-align:left}
.near button:last-child{border-bottom:0}
.tbar{position:absolute;left:10px;right:10px;bottom:22px;z-index:550;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mapwrap:has(.mpanel:not([hidden])) .tbar{right:380px}
.tplay{width:34px;height:34px;border-radius:50%;border:0;background:var(--teal);display:grid;place-items:center;flex:none}
.tplay svg{width:15px;height:15px;fill:#062C2C}
.tbar .seg{margin:0;padding:2px;flex:none}
.tbar .seg button{padding:5px 10px;font-size:.8rem}
.tbar input[type=range]{flex:1 1 160px;min-width:110px;accent-color:var(--teal)}
.tlabel{font-size:.8rem;color:var(--ink);font-weight:700;white-space:nowrap;min-width:150px}
.tlabel small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.mstatus.up{bottom:84px}
@media (max-width:900px){.mapwrap:has(.mpanel:not([hidden])) .tbar{right:10px}}
@media (max-width:640px){.tbar{bottom:24px;gap:6px 8px}.tbar input[type=range],.tlabel{flex:1 1 100%;min-width:0}.mstatus.up{display:none}}
.pastdays{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.pastdays div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 4px;text-align:center;font-size:.72rem;line-height:1.25}
.pastdays b,.pastdays span{display:block}
.pastdays b{color:var(--ink);font-size:.74rem}
.pastdays .c{font-size:.95rem;font-weight:700}
.pastdays .c.good{color:var(--ok)} .pastdays .c.some{color:var(--warn)} .pastdays .c.none{color:var(--bad)}
.leaflet-clouds-pane{filter:var(--cloud-filter);mix-blend-mode:var(--cloud-blend)}
.leaflet-osm-pane{filter:var(--osm-filter)}
.leaflet-land-pane,.leaflet-borders-pane{pointer-events:none}
.pin.alt{background:var(--surface);color:var(--ink);border-color:var(--muted);font-size:11px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pin.alt.small{font-size:10px;padding:0 3px}
.pin.alt.sel,.pin.sel{background:var(--ink);color:var(--bg);border-color:var(--teal)}
.themebtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.82rem;color:var(--text);font-weight:700}
.themebtn:hover{border-color:var(--teal)}
.themebtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail .themebtn{align-self:flex-start;margin:auto 4px 12px}
.rail .themebtn + .me{margin-top:0}
.tablewrap{overflow-x:auto}
table.apt{width:100%;border-collapse:collapse;font-size:.9rem}
.apt th{background:var(--surface-2);text-align:left;border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
.apt th button,.apt th span{display:block;background:none;border:0;padding:10px 12px;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;width:100%;text-align:left}
.apt th button:hover{color:var(--ink)}
.apt td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.apt tbody tr{cursor:pointer}
.apt tbody tr:hover,.apt tbody tr:focus-visible{background:var(--surface-2)}
.apt tbody tr:last-child td{border-bottom:0}
.apt .code{font-family:var(--f-code);font-weight:700;font-size:1.05rem;color:var(--ink);letter-spacing:.02em}
.apt .code.dirc{color:var(--teal-ink)}
.apt td.r{text-align:right;white-space:nowrap}
.apt td b{color:var(--ink)}
@media (max-width:640px){.hide-s{display:none}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.9rem;z-index:60;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <aside class="rail" aria-label="Main">
    <span class="plate"><img src="__LOGO__" alt="EAASI"></span>
    <div class="product">Ops Hub · Aerial Operations</div>
    <nav class="nav" id="nav"></nav>
    <button class="themebtn" type="button" onclick="cycleTheme()"></button>
    <div class="me"><span class="avatar">MM</span><div><b style="color:var(--ink)">Marcos Martínez</b><div class="muted small">Validator · Secretary General</div></div></div>
  </aside>
  <header class="topbar">
    <span class="plate"><img src="__LOGO__" alt="EAASI"></span>
    <span class="t">Ops Hub</span>
    <button class="themebtn" type="button" onclick="cycleTheme()"></button>
    <span class="avatar">MM</span>
  </header>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA = /*__DATA__*/null;
const LOGO = "__LOGO__";
const ME = "Marcos Martínez";
const NOW = new Date();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const CCM = {Spain:"ES",Portugal:"PT",France:"FR",Italy:"IT",Germany:"DE",Austria:"AT",Switzerland:"CH",Netherlands:"NL",Denmark:"DK",Sweden:"SE",Norway:"NO",Finland:"FI",Poland:"PL",Czechia:"CZ",Croatia:"HR",Serbia:"RS",Greece:"GR","United Kingdom":"UK",Belgium:"BE"};
const ccOf = c => CCM[c] || CCM[String(c).split(/\s*·\s*/)[0]] || String(c).slice(0,2).toUpperCase();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function linkify(t){
  return esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;)])/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}
const host = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return u; } };
function monthsSince(d){ return (NOW - new Date(d)) / (30.44*864e5); }
function ago(d){
  const days = Math.floor((NOW - new Date(d))/864e5);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 45) return days + " days ago";
  const m = Math.round(days/30.44);
  return m + " months ago";
}
function fmtDate(d){ return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
const store = {
  get(k,f){ try{ const v = localStorage.getItem("eaasi-ops:"+k); return v ? JSON.parse(v) : f; }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem("eaasi-ops:"+k, JSON.stringify(v)); }catch(e){} }
};
function toast(msg){
  const r = $("#toastRoot"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(()=> r.innerHTML="", 2600);
}
const ICON = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  permits:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h5"/>',
  dir:'<path d="M2 16l20-7-3-2-6 2-6-5-2 1 4 6-5 2-2-1-1 1z"/><path d="M3 21h18"/>',
  radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/>',
  map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  chat:'<path d="M4 20l1.6-4.2A8 8 0 1 1 9 19.4z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const svg = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- theme ---------- */
const THEMES = ["auto","light","dark"], THEME_LABEL = {auto:"Auto", light:"Light", dark:"Dark"};
const THEME_ICON = {
  auto:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/>',
  light:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
  dark:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'
};
let THEME = store.get("theme", "auto");
function applyTheme(t){
  const r = document.documentElement;
  if (t==="light" || t==="dark") r.dataset.theme = t; else delete r.dataset.theme;
  THEME = t;
  document.querySelectorAll(".themebtn").forEach(b => {
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${THEME_ICON[t]}</svg><span>${THEME_LABEL[t]}</span>`;
    b.setAttribute("aria-label", `Theme: ${THEME_LABEL[t]}. Switch theme`);
    b.title = t==="auto" ? "Theme follows your device. Click for light." : t==="light" ? "Light theme. Click for dark." : "Dark theme. Click to follow your device.";
  });
}
function cycleTheme(){
  const t = THEMES[(THEMES.indexOf(THEME)+1) % THEMES.length];
  store.set("theme", t); applyTheme(t);
  if (MAP.map){ MAP.map.remove(); MAP.map = null; }
  render(); toast("Theme: " + THEME_LABEL[t]);
}
applyTheme(THEME);

/* ---------- airports (OurAirports + EAASI directory) ---------- */
const AP_TYPE = {L:"International", M:"Regional", S:"Airfield"};
const fmtN = n => Number(n).toLocaleString("en-GB");
const AP = (() => {
  const src = DATA.allairports, f = src.fields, cur = {};
  DATA.airports.forEach((a,i) => cur[a.icao] = i);
  return src.rows.map(r => {
    const o = {}; f.forEach((k,j) => o[k] = r[j]);
    o.country = src.countries[o.cc] || o.cc;
    o.cur = cur[o.icao] ?? null;
    o.pri = o.cur!=null ? 0 : ({L:1, M:2, S:3})[o.type];
    return o;
  }).sort((a,b) => a.pri-b.pri || b.sched-a.sched || b.rwy-a.rwy);
})();
const AP_BY = {}; AP.forEach((a,i) => AP_BY[a.icao] = i);
const apOf = icao => AP[AP_BY[icao]];

/* ---------- state ---------- */
const S = {
  view: "home", dir: "airports",
  permitFilter: "all", q: "",
  verif: store.get("verif", {}),        // key -> {by, at}
  queue: store.get("queue", null),
  applied: store.get("applied", {}),    // "permit:ES:field" -> value
  chat: [], busy: false
};
DATA.permits.forEach(p => {
  for (const [k,v] of Object.entries(S.applied)) { const [m,id,f] = k.split(":"); if (m==="permit" && id===p.id) p[f]=v; }
});
if (!S.queue){
  S.queue = [];
  DATA.permits.forEach(p => (p.issues||[]).forEach(is => S.queue.push({
    id:"sys-"+p.id+"-"+is.field, source:"system", module:"permit", recordId:p.id, recordName:p.country+" permit card",
    field:is.field, current:p[is.field], proposed:null, evidence:is.text, by:"Data check", at:NOW.toISOString()
  })));
  DATA.radar.filter(r=>r.conflict).forEach(r => r.affects.forEach(id => {
    const p = DATA.permits.find(x=>x.id===id);
    S.queue.push({ id:"rad-"+r.id+"-"+id, source:"radar", module:"permit", recordId:id, recordName:p.country+" permit card",
      field:"guide", current:"Procedure as verified "+fmtDate(p.updated), proposed:null,
      evidence:r.title+" ("+fmtDate(r.date)+"). "+r.impact, by:"Regulatory radar", at:NOW.toISOString(), radar:r.id });
  }));
  store.set("queue", S.queue);
}
const saveQ = () => store.set("queue", S.queue);

function verifOf(module, id, fallbackDate, fallbackBy){
  const v = S.verif[module+":"+id];
  if (v) return v;
  return fallbackDate ? {by:fallbackBy, at:fallbackDate} : null;
}
function stamp(module, id, fallbackDate, fallbackBy, researched){
  const v = verifOf(module, id, fallbackDate, fallbackBy);
  if (!v){
    return `<div class="stamp new"><div class="ticks">${"<i></i>".repeat(12)}</div><span>Researched from public sources · <b>to validate</b></span></div>`;
  }
  const m = monthsSince(v.at), on = Math.min(12, Math.max(1, Math.ceil(m)));
  const cls = m < 6 ? "ok" : m < 12 ? "warn" : "bad";
  const ticks = Array.from({length:12}, (_,i)=>`<i class="${i<on?"on":""}"></i>`).join("");
  return `<div class="stamp ${cls}" title="Verified ${fmtDate(v.at)}"><div class="ticks" aria-hidden="true">${ticks}</div><span>Verified <b>${ago(v.at)}</b> · ${esc(v.by)}</span></div>`;
}
function freshClass(p){ const v = verifOf("permit", p.id, p.updated, p.owner); const m = monthsSince(v.at); return m<6?"ok":m<12?"warn":"bad"; }
function confirmValid(module, id, label){
  S.verif[module+":"+id] = {by:ME, at:NOW.toISOString()};
  store.set("verif", S.verif);
  toast(label + " confirmed as still valid");
  render(); if (S.sheet) openSheet(S.sheet);
}

/* ---------- navigation ---------- */
const VIEWS = [
  {id:"home", label:"Home", icon:"home"},
  {id:"permits", label:"Flight permits", short:"Permits", icon:"permits"},
  {id:"map", label:"Map & weather", short:"Map", icon:"map"},
  {id:"dir", label:"Directory", icon:"dir"},
  {id:"radar", label:"Regulatory radar", short:"Radar", icon:"radar"},
  {id:"chat", label:"Ask the assistant", short:"Assistant", icon:"chat"}
];
function renderNav(){
  const pending = S.queue.length;
  $("#nav").innerHTML = VIEWS.map(v => `<button data-go="${v.id}" ${S.view===v.id?'aria-current="page"':""}>${svg(v.icon)}<span>${v.label}</span>${v.id==="home"&&pending?`<span class="badge num">${pending}</span>`:""}</button>`).join("");
  $("#tabbar").innerHTML = VIEWS.map(v => `<button data-go="${v.id}" ${S.view===v.id?'aria-current="page"':""}>${svg(v.icon)}<span>${v.short||v.label}</span>${v.id==="home"&&pending?`<span class="badge num">${pending}</span>`:""}</button>`).join("");
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g){ go(g.dataset.go, g.dataset.sub); return; }
  const o = e.target.closest("[data-open]"); if (o){ openSheet(o.dataset.open); return; }
  const c = e.target.closest("[data-copy]"); if (c){ copy(c, c.dataset.copy); return; }
});
function go(v, sub){ S.view = v; if (sub) S.dir = sub; S.q=""; closeSheet(); render(); window.scrollTo(0,0); if (v==="chat") setTimeout(()=>$("#msg")?.focus(),50); }

/* ---------- HOME ---------- */
function renderHome(){
  const P = DATA.permits;
  const overdue = P.filter(p => freshClass(p)==="bad").length;
  const flagged = DATA.radar.filter(r=>r.conflict).length;
  const toValidate = DATA.airports.length + DATA.mro.length + DATA.insurance.length
    - Object.keys(S.verif).filter(k=>!k.startsWith("permit:")).length;
  const owners = {};
  P.forEach(p => { (owners[p.owner] ||= []).push(p); });
  const jorg = owners["Jörg Werti · BSF"] || [];
  const q = S.queue;
  return `
  <div class="head"><div><div class="eyebrow">EAASI Aerial Operations Committee</div><h1>What needs attention</h1>
  <p class="muted">Summit preview. Permit cards come from the current member area. Directory and radar entries were collected from public sources on 29 Sep 2026 and are waiting for member validation.</p></div></div>
  <div class="kpis">
    <button class="kpi bad" data-go="permits"><span class="v num">${overdue}<span class="muted small"> / ${P.length}</span></span><span class="l">Permit cards not verified in the last 12 months</span></button>
    <button class="kpi warn" data-go="radar"><span class="v num">${flagged}</span><span class="l">Regulatory change that may affect a card</span></button>
    <button class="kpi" onclick="document.getElementById('queue').scrollIntoView({behavior:'smooth'})"><span class="v num">${q.length}</span><span class="l">Items waiting for a validator</span></button>
    <button class="kpi teal" data-go="dir"><span class="v num">${toValidate}</span><span class="l">Directory entries to validate</span></button>
  </div>
  <div class="grid2 section">
    <div id="queue"><span class="eyebrow">Validation queue</span>
      <div class="stack">${q.length ? q.map(qItem).join("") : `<div class="card empty">Nothing waiting. Corrections members send through the assistant land here.</div>`}</div>
    </div>
    <div><span class="eyebrow">What an owner receives on WhatsApp</span>
      <div class="wa" aria-label="Example WhatsApp reminder">
        <div class="from">Preview · EAASI Ops · monthly reminder</div>
        <div class="bub">Hi Jörg 👋 You own ${jorg.length} permit cards on the EAASI Ops Hub:
${jorg.map(p=>`• ${p.country} — verified ${ago(p.updated)}`).join("\n")}

Reply 1 if they are all still valid.
Reply 2 to update one of them.<span class="meta">09:00</span></div>
        <div class="bub out">1<span class="meta">09:14 ✓✓</span></div>
        <div class="bub">Thanks! Germany, Austria and Switzerland now show "Verified today · Jörg Werti".<span class="meta">09:14</span></div>
      </div>
      <p class="muted small" style="margin-top:8px">Confirming takes one reply. Changes go to the validation queue before anyone else sees them.</p>
    </div>
  </div>
  <div class="section"><span class="eyebrow">Modules</span>
    <div class="modgrid">
      <button class="mod" data-go="permits"><span class="n num">${P.length}</span><b>Flight permits</b><span class="muted small">Country procedures</span></button>
      <button class="mod" data-go="radar"><span class="n num">${DATA.radar.length}</span><b>Regulatory radar</b><span class="muted small">EASA and national changes</span></button>
      <button class="mod" data-go="dir" data-sub="airports"><span class="n num">${fmtN(AP.length)}</span><b>Airports &amp; FBO</b><span class="muted small">${DATA.airports.length} with handling info</span></button>

function qItem(it){
  const src = it.source==="system" ? `<span class="tag bad">Data check</span>` : it.source==="radar" ? `<span class="tag warn">Regulatory radar</span>` : `<span class="tag teal">From ${esc(it.by)} via assistant</span>`;
  const canApply = it.proposed != null && it.proposed !== "";
  return `<div class="card qitem ${it.source==="system"?"sys":""}">
    <div class="row">${src}<b style="color:var(--ink)">${esc(it.recordName)}</b><span class="muted small">field: ${esc(it.field)}</span></div>
    <dl class="diff"><dt>Now</dt><dd>${esc(String(it.current ?? "—")).slice(0,160)}</dd>${canApply?`<dt>Proposed</dt><dd class="new">${esc(it.proposed)}</dd>`:""}<dt>Why</dt><dd>${esc(it.evidence)}</dd></dl>
    <div class="actions">
      ${canApply?`<button class="btn sm" onclick="resolveQ('${it.id}',true)">Approve change</button>`:`<button class="btn sm" onclick="resolveQ('${it.id}',true)">Ask owner to check</button>`}
      <button class="btn sm quiet" onclick="resolveQ('${it.id}',false)">Dismiss</button>
      <button class="btn sm ghost" data-open="${it.module}:${it.recordId}">Open card</button>
    </div></div>`;
}
function resolveQ(id, ok){
  const it = S.queue.find(x=>x.id===id); if(!it) return;
  S.queue = S.queue.filter(x=>x.id!==id); saveQ();
  if (ok && it.proposed != null && it.proposed !== "" && it.module==="permit"){
    const p = DATA.permits.find(x=>x.id===it.recordId);
    if (p && it.field in p){ p[it.field] = it.proposed; S.applied[`permit:${p.id}:${it.field}`]=it.proposed; store.set("applied",S.applied); }
    if (p){ p.issues = (p.issues||[]).filter(i=>i.field!==it.field); }
    S.verif["permit:"+it.recordId] = {by:ME, at:NOW.toISOString()}; store.set("verif",S.verif);
    toast("Change approved and published");
  } else if (ok && it.module==="ap"){
    toast("Approved. It joins the directory with the next data update");
  } else if (ok){
    const p = DATA.permits.find(x=>x.id===it.recordId);
    toast(`Reminder queued for ${p?p.owner:"the owner"}`);
  } else toast("Dismissed");
  render();
}

/* ---------- SHEET (details) ---------- */
function openSheet(ref){
  S.sheet = ref;
  const [m, id] = ref.split(":");
  let title="", sub="", code="", body="";
  if (m==="permit"){ const p = DATA.permits.find(x=>x.id===id); ({title,sub,code,body} = permitDetail(p)); }
  if (m==="ap"){ const a = apOf(id); if (!a) return; title=a.name; sub=[a.city,a.country].filter(Boolean).join(", "); code=a.icao; body=apDetail(a); }
  if (m==="airport"){ const a = DATA.airports[+id]; title=a.name; sub=a.city+", "+a.country; code=a.icao; body=airportDetail(a,+id); }
  if (m==="mro"){ const x = DATA.mro[+id]; title=x.name; sub=[x.city,x.country].filter(Boolean).join(", "); code=ccOf(x.country); body=mroDetail(x,+id); }
  if (m==="ins"){ const x = DATA.insurance[+id]; title=x.name; sub=x.type+" · "+x.country; code=ccOf(x.country); body=insDetail(x,+id); }
  if (m==="asset"){ const x = DATA.assets[+id]; title=x.company; sub=x.country; code=ccOf(x.country); body=assetDetail(x,+id); }
  if (m==="radar"){ S.sheet=null; go("radar"); return; }
  $("#sheetRoot").innerHTML = `<div class="scrim" onclick="closeSheet()"></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><span class="cc ${code.length>2?"icao":""}">${esc(code)}</span><div style="min-width:0"><h2>${esc(title)}</h2><div class="muted small">${esc(sub)}</div></div>
    <button class="x" onclick="closeSheet()" aria-label="Close">${svg("x")}</button></header>
    <div class="body">${body}</div></aside>`;
  $(".sheet .x").focus();
}
function closeSheet(){ S.sheet=null; $("#sheetRoot").innerHTML=""; }
document.addEventListener("keydown", e => {
  if (e.key==="Escape" && S.sheet) closeSheet();
  if (e.key==="Enter" && e.target.matches && e.target.matches("tr[data-open]")) openSheet(e.target.dataset.open);
});

function permitDetail(p){
  const rad = DATA.radar.filter(r=>r.affects.includes(p.id));

function lyr8Block(p){
  const c = p.zone.coords, ap = DATA.airports.find(a=>a.icao==="LYBE");
  const pts = c.concat(ap?[[ap.lon,ap.lat]]:[]);
  const minX=Math.min(...pts.map(x=>x[0]))-.03, maxX=Math.max(...pts.map(x=>x[0]))+.03, minY=Math.min(...pts.map(x=>x[1]))-.02, maxY=Math.max(...pts.map(x=>x[1]))+.02;
  const k = Math.cos(44.83*Math.PI/180), W=480, H=Math.round(W*(maxY-minY)/((maxX-minX)*k));
  const X = x => ((x-minX)/(maxX-minX)*W).toFixed(1), Y = y => ((maxY-y)/(maxY-minY)*H).toFixed(1);
  const grid = [];
  for (let x=Math.ceil(minX*20)/20; x<maxX; x+=.05) grid.push(`<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${H}" stroke="var(--line)"/><text x="${+X(x)+3}" y="${H-5}" font-size="10" fill="var(--muted)">${x.toFixed(2)}°E</text>`);
  for (let y=Math.ceil(minY*50)/50; y<maxY; y+=.02) grid.push(`<line x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}" stroke="var(--line)"/><text x="4" y="${+Y(y)-3}" font-size="10" fill="var(--muted)">${y.toFixed(2)}°N</text>`);
  return `<div class="block"><h3>Restricted zone LY-R8 (Belgrade)</h3>
    <div class="mapbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="LY-R8 polygon east of Belgrade Nikola Tesla airport">
      ${grid.join("")}
      <polygon points="${c.map(p=>X(p[0])+","+Y(p[1])).join(" ")}" fill="var(--bad-wash)" stroke="var(--bad)" stroke-width="2"/>
      <text x="${X(20.45)}" y="${Y(44.826)}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--bad)">LY-R8</text>
      ${ap?`<circle cx="${X(ap.lon)}" cy="${Y(ap.lat)}" r="5" fill="var(--teal)" stroke="var(--ink)" stroke-width="1.5"/><text x="${+X(ap.lon)+9}" y="${+Y(ap.lat)+4}" font-size="12" font-weight="700" fill="var(--ink)">LYBE</text>`:""}
    </svg></div>
    <p class="muted small" style="margin-top:6px">Polygon from the member-supplied KMZ (${c.length} vertices). A separate Civil Aviation Directorate application is needed only inside LY-R8.</p></div>`;
}

function refLabel(id){
  const [m,k] = id.split(":");
  if (m==="permit"){ const p=DATA.permits.find(x=>x.id===k); return p?p.country+" permit":null; }
  if (m==="airport"){ const a=DATA.airports[+k]; return a?a.icao+" "+a.name:null; }
  if (m==="ap"){ const a=apOf(k); return a?a.icao+" "+a.name:null; }
  if (m==="mro"){ const a=DATA.mro[+k]; return a?a.name:null; }
  if (m==="ins"){ const a=DATA.insurance[+k]; return a?a.name:null; }
  if (m==="asset"){ const a=DATA.assets[+k]; return a?a.company+" fleet":null; }
  if (m==="radar"){ const r=DATA.radar.find(x=>x.id===k); return r?"Radar: "+r.title.slice(0,32)+"…":null; }
  return null;
}
function knowledge(){
  const P = DATA.permits.map(p=>({id:"permit:"+p.id,country:p.country,authority:p.authority,processingDays:p.lead,submitDayBefore:p.dayBefore,localEntityRequired:p.localEntity,defenceApproval:p.defence,
    procedure:p.guide,documents:p.docs,web:p.web,email:p.contact,submitTo:p.submission,online:p.online,phone:p.phone,atcWeb:p.atcWeb,atcEmail:p.atcMail,atcPhone:p.atcPhone,
    owner:p.owner,lastVerified:(verifOf("permit",p.id,p.updated,p.owner)||{}).at?.slice(0,10),knownIssues:(p.issues||[]).map(i=>i.text),
    restrictedSheets:p.zones?p.zones.map(z=>z.sheet+" "+z.name).join("; "):undefined, restrictedZone:p.zone?"LY-R8 polygon lon 20.39–20.49E, lat 44.80–44.85N, east of LYBE":undefined}));
  const A = DATA.airports.map((a,i)=>({id:"airport:"+i,icao:a.icao,name:a.name,city:a.city,country:a.country,fuel:a.fuel,hours:a.hours,handler:a.handler,customs:a.customs,hangar:a.hangar,ppr:a.ppr,note:a.note}));
  const M = DATA.mro.map((m,i)=>({id:"mro:"+i,name:m.name,country:m.country,city:m.city,approvals:m.approvals,types:m.types,surveyMods:m.mods,services:m.services,url:m.url}));
  const I = DATA.insurance.map((m,i)=>({id:"ins:"+i,name:m.name,type:m.type,country:m.country,lines:m.lines,aerialWork:m.aerial,url:m.url}));
  const F = DATA.assets.map((m,i)=>({id:"asset:"+i,company:m.company,country:m.country,aircraft:m.aircraft.map(x=>x.filter(Boolean).join(" ")),sensors:m.sensors.map(x=>x.filter(Boolean).join(" ")),leaseAvailability:"not published"}));
  const R = DATA.radar.map(r=>({id:"radar:"+r.id,date:r.date,scope:r.scope,type:r.type,title:r.title,status:r.status,summary:r.summary,impact:r.impact,url:r.url}));
  return JSON.stringify({permits:P,airports:A,mro:M,insurance:I,radar:R});
}
function rules(){
  return `You are "EAASI Ops", the WhatsApp assistant of the European Association of Aerial Surveying Industries (EAASI) for member companies that fly manned aerial survey missions. Today is ${NOW.toISOString().slice(0,10)}.

Answer ONLY from the DATA below. If the answer is not in DATA, say so plainly and suggest asking the committee. Never invent contacts, numbers, deadlines or approvals. When a permit card was last verified more than 12 months ago, say so briefly so the member double-checks.
Reply in the same language as the member's last message. WhatsApp style: short, plain text, no markdown headings or bold, bullets with "• ", at most about 120 words. Include the key contact or next step when relevant.

If the member reports that something in DATA is wrong or has changed, do NOT treat it as fact. Thank them, say a validator will review it, and fill "proposal".

Reply with ONLY one JSON object:
{"reply": string, "refs": [ids from DATA you used, max 4, e.g. "permit:RS", "airport:0"], "proposal": null or {"recordId": id from DATA, "field": short field name, "proposed": new value or null if they did not give one, "evidence": what the member said}}

DATA:
${knowledge()}`;
}
async function ask(text){
  text = String(text||"").trim(); if (!text || S.busy) return;
  const box = $("#msg"); if (box) box.value = "";
  S.chat.push({role:"user", content:text}); S.busy = true; paintChat();
  let res = null;
  if (sampleFn){
    const turns = [{role:"user", content:rules()}];
    S.chat.filter(m=>m.role==="user"||m.role==="bot").slice(-8).forEach(m => turns.push({role:m.role==="user"?"user":"assistant", content:m.content}));
    try { res = await sampleFn.json(turns, {modelTier:"quick", cache:false}); }
    catch(e){
      if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code)){ sampleFn = null; updateMode(); }
      else if (e?.code==="rate_limited"){ res = {reply:"Too many questions at once. Wait a moment and try again.", refs:[]}; }
    }
  }
  if (!res) res = localAnswer(text);
  S.busy = false;
  const refs = (Array.isArray(res.refs)?res.refs:[]).map(String).map(id=>({id, label:refLabel(id)})).filter(r=>r.label).slice(0,4);
  S.chat.push({role:"bot", content:String(res.reply||"Sorry, I could not answer that."), refs});
  if (res.proposal && res.proposal.recordId){
    const pr = res.proposal, label = refLabel(String(pr.recordId)) || String(pr.recordId);
    const [mod, rid] = String(pr.recordId).split(":");
    const item = {id:"u-"+Date.now(), source:"member", module:mod, recordId:rid, recordName:label, field:String(pr.field||"—"),
      current: mod==="permit" ? (DATA.permits.find(p=>p.id===rid)||{})[pr.field] : null, proposed: pr.proposed ?? null,
      evidence:String(pr.evidence||text), by:ME, at:NOW.toISOString()};
    S.queue.unshift(item); saveQ(); renderNav();
    S.chat.push({role:"sent", recordName:label, field:item.field, proposed:item.proposed});
  }
  paintChat();
}

/* offline fallback: keyword search over the same data */
const ALIAS = {ES:["spain","españa","espana"],DE:["germany","alemania","deutschland"],AT:["austria"],CH:["switzerland","suiza"],NL:["netherlands","holanda","países bajos","paises bajos"],DK:["denmark","dinamarca"],SE:["sweden","suecia"],NO:["norway","noruega"],FI:["finland","finlandia"],IS:["iceland","islandia"],RS:["serbia"],MK:["macedonia"],ME:["montenegro"]};
function localAnswer(text){
  const t = text.toLowerCase();
  const refs = [];
  const fix = /(wrong|incorrect|outdated|changed|mal|error|equivocad|incorrect|actualiz|ya no)/.test(t);
  const cc = Object.entries(ALIAS).find(([k,a])=>a.some(w=>t.includes(w)))?.[0];
  if (fix && cc){
    const p = DATA.permits.find(x=>x.id===cc);
    const field = /phone|teléfono|telefono/.test(t)?"phone":/mail/.test(t)?"contact":/day|día|plazo|time/.test(t)?"lead":"guide";
    return {reply:`Thanks. I've sent your note about the ${p.country} card to a validator. The card owner (${p.owner}) will be asked to confirm.`, refs:["permit:"+cc], proposal:{recordId:"permit:"+cc, field, proposed:null, evidence:text}};
  }
  const sheet = t.match(/\b(\d{4})(-\d)?\b/);
  if (sheet && /sheet|hoja|restric/.test(t)){
    const z = DATA.permits.find(p=>p.id==="ES").zones.filter(s=>s.sheet.startsWith(sheet[1]));
    return {reply: z.length ? `Yes. MTN sheet${z.length>1?"s":""} ${z.map(s=>s.sheet+" "+s.name).join(", ")} ${z.length>1?"are":"is"} on the IGN list of zones restricted to photogrammetric flight. RCC forwards the request to CECAF.` : `Sheet ${sheet[1]} is not on the IGN restricted list.`, refs:["permit:ES"]};
  }
  if (cc){
    const p = DATA.permits.find(x=>x.id===cc);
    const bits = [`• Authority: ${p.authority}`];
    if (p.localEntity) bits.push("• Only a locally registered legal entity can hold the permit");
    if (p.defence==="yes") bits.push("• Defence approval is required first");
    bits.push(`• Processing: ${p.dayBefore?"submit the day before":p.lead?p.lead+" days":"not recorded"}`);
    if (p.submission||p.contact) bits.push(`• Contact: ${p.submission&&/@/.test(p.submission)?p.submission:p.contact}`);
    const v = verifOf("permit",p.id,p.updated,p.owner);
    return {reply:`${p.country}:\n${bits.join("\n")}\nLast verified ${ago(v.at)} by ${v.by}, so double-check before you apply.`, refs:["permit:"+cc]};
  }
  const types = ["p68","c208","caravan","pa-31","navajo","da42","da62","king air"];
  const ty = types.find(x=>t.includes(x));
  if (ty || /mro|145|maint|manten|hatch|trampilla|stc/.test(t)){
    const k = ty ? ty.replace("caravan","c208").replace("navajo","pa-31") : null;
    const M = DATA.mro.map((m,i)=>({m,i})).filter(({m})=>!k || m.types.join(" ").toLowerCase().includes(k.replace("da42","da42").replace("da62","da62")))
      .filter(({m})=>!/hatch|trampilla|camera|cámara|stc/.test(t) || (m.mods && /hatch|camera|sensor|LiDAR|STC/i.test(m.mods)));
    M.slice(0,4).forEach(({i})=>refs.push("mro:"+i));
    return {reply: M.length ? `Organisations in the directory${k?" for "+k.toUpperCase():""}:\n${M.slice(0,4).map(({m})=>`• ${m.name} (${m.country})${m.mods?" — does survey mods":""}`).join("\n")}` : "I don't have a matching organisation in the directory yet.", refs};
  }
  if (/insur|segur|broker|corredor/.test(t)){
    const I = DATA.insurance.map((x,i)=>({x,i})).filter(({x})=>x.aerial&&/aerial/i.test(x.aerial));
    I.slice(0,3).forEach(({i})=>refs.push("ins:"+i));
    return {reply:`Brokers whose sites mention aerial work:\n${I.slice(0,3).map(({x})=>`• ${x.name} (${x.country})`).join("\n")}\nNone names sensor cover explicitly, so ask about it.`, refs};
  }
  const city = DATA.airports.map((a,i)=>({a,i})).filter(({a})=>t.includes(a.city.toLowerCase().split(" ")[0]) || t.includes(a.icao.toLowerCase()) || t.includes(a.country.toLowerCase()) || (/valencia/.test(t)&&a.country==="Spain"));
  if (city.length || /airport|aeropuert|fbo|avgas|fuel|combustible/.test(t)){
    let A = city.length ? city : DATA.airports.map((a,i)=>({a,i}));
    if (/avgas/.test(t)) A = A.filter(({a})=>(a.fuel||[]).some(f=>/AVGAS/.test(f)));
    A.slice(0,4).forEach(({i})=>refs.push("airport:"+i));
    return {reply:`${A.slice(0,4).map(({a})=>`• ${a.icao} ${a.name} — ${(a.fuel||[]).join(", ")}, ${a.hours}`).join("\n")}`, refs};
  }
  if (/regul|easa|norma|rule|gnss|part/.test(t)){
    const R = DATA.radar.slice(0,3); R.forEach(r=>refs.push("radar:"+r.id));
    return {reply:`Latest on the radar:\n${R.map(r=>`• ${r.title} (${r.status})`).join("\n")}`, refs};
  }
  return {reply:"I couldn't match that to a permit card, airport, MRO, broker, fleet or regulation. Try naming a country, airport, aircraft type or topic.", refs:[]};
}


/* ---------- MAP & WEATHER ---------- */
const MAP = { map:null, live:null, layers:{}, markers:{}, ap:new Map(), sel:null, view:null, show:{airports:true, mro:true, clouds:false, radar:false}, cache:{} };

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* Declutter: walk airports in priority order (directory, international, regional, airfield) and skip any that would sit
   too close on screen to one already placed. Fewer per country when zoomed out, all of them when zoomed in. */
function apGap(z){ return z<=3 ? 120 : z===4 ? 90 : z===5 ? 64 : z===6 ? 48 : z===7 ? 38 : z===8 ? 28 : 0; }
function apCap(z){ return z<=4 ? 2 : z===5 ? 6 : Infinity; }
function placeAirports(){
  const map = MAP.map; if (!map || !MAP.show.airports) return;
  const grp = MAP.markers.airports, z = map.getZoom(), gap = apGap(z), cap = apCap(z), b = map.getBounds().pad(0.2);
  const selIcao = MAP.sel && MAP.sel.kind==="ap" ? MAP.sel.icao : null;
  const placed = [], per = {}, want = new Set();
  const order = selIcao && apOf(selIcao) ? [apOf(selIcao), ...AP] : AP;
  for (const a of order){
    if (want.has(a.icao) || !b.contains([a.lat, a.lon])) continue;
    const p = map.latLngToLayerPoint([a.lat, a.lon]);
    if (a.icao !== selIcao){
      if ((per[a.cc]||0) >= cap) continue;
      if (gap && placed.some(q => Math.abs(q.x-p.x) < gap && Math.abs(q.y-p.y) < gap*0.55)) continue;
    }
    placed.push(p); per[a.cc] = (per[a.cc]||0) + 1; want.add(a.icao);
  }
  for (const [icao, m] of MAP.ap) if (!want.has(icao)){ grp.removeLayer(m); MAP.ap.delete(icao); }
  for (const icao of want) if (!MAP.ap.has(icao)){
    const a = apOf(icao);
    const cls = a.cur!=null ? "pin" : a.type==="S" ? "pin alt small" : "pin alt";
    const m = L.marker([a.lat, a.lon], {icon:L.divIcon({className:"", html:`<span class="${cls}${icao===selIcao?" sel":""}" data-k="ap:${icao}">${icao}</span>`, iconSize:[0,0]}),
      title:a.name, keyboard:true, riseOnHover:true, zIndexOffset: a.cur!=null ? 1000 : (3-a.pri)*100});
    m.on("click", () => selectAirport(icao));
    grp.addLayer(m); MAP.ap.set(icao, m);
  }
}
function setStatus(extra){
  const el = $("#mstatus"); if (!el) return;
  el.innerHTML = MAP.live ? `<b>Live weather on</b>${extra ? " · "+extra : (MAP.show.clouds||MAP.show.radar) ? "" : " · turn on clouds or rain to see the last 2 hours or past 6 days"}` : `<b>Preview mode.</b> ${LIVE_HINT}`;

/* ---------- weather timeline: loop of the last 2 hours, or the past 6 days ---------- */
const CLOUD_WMS = "https://view.eumetsat.int/geoserver/wms", CLOUD_LAYER = "mtg_fd:ir105_hrfi";
const IMERG = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/IMERG_Precipitation_Rate/default/{T}/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png";
const ATTR = {
  clouds:'Clouds © <a href="https://view.eumetsat.int" target="_blank" rel="noopener">EUMETSAT</a>',
  rv:'Weather data by <a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a>',
  im:'Rain estimate: <a href="https://gpm.nasa.gov/data/imerg" target="_blank" rel="noopener">NASA IMERG</a> via GIBS'

const OPA = {clouds:.85, radar:.8};
const TL = { mode:"2h", frames:[], idx:0, playing:false, timer:null, wait:0, latest:null, latestAt:0, rv:null, rvAt:0, layers:{clouds:new Map(), radar:new Map()}, shown:{clouds:null, radar:null} };
function resetTimeline(){

  TL.layers = {clouds:new Map(), radar:new Map()}; TL.shown = {clouds:null, radar:null};
}
const iso = d => new Date(d).toISOString().replace(/\.\d{3}Z$/, "Z");
async function cloudLatest(){
  if (TL.latest && Date.now()-TL.latestAt < 5*60e3) return TL.latest;
  let t = null;
  try {
    const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), 5000);
    const x = await (await fetch("https://view.eumetsat.int/geoserver/mtg_fd/ir105_hrfi/ows?service=WMS&request=GetCapabilities&version=1.3.0", {signal:ctl.signal})).text();
    clearTimeout(to);
    const m = x.match(/name="time"[^>]*default="([^"]+)"/) || x.match(/default="([^"]+)"[^>]*name="time"/);
    if (m) t = new Date(m[1]);
  } catch(e){}
  if (!t || isNaN(t)) t = new Date(Math.floor((Date.now()-40*60e3)/600e3)*600e3);   // typical latency ~30 min

}
async function radarIndex(){
  if (TL.rv && Date.now()-TL.rvAt < 5*60e3) return TL.rv;
  try { const j = await (await fetch("https://api.rainviewer.com/public/weather-maps.json")).json(); TL.rv = {host:j.host, past:j.radar.past}; TL.rvAt = Date.now(); }
  catch(e){ TL.rv = null; }
  return TL.rv;
}
async function buildFrames(){
  let end = await cloudLatest();

    const rv = await radarIndex();
    if (rv && rv.past.length){ const r = new Date(rv.past[rv.past.length-1].time*1000); if (!MAP.show.clouds || r > end) end = r; }
  }
  const step = TL.mode==="2h" ? 10 : 60, span = TL.mode==="2h" ? 120 : 6*24*60;
  if (TL.mode==="6d") end = new Date(Math.floor(end/3600e3)*3600e3);

function cloudKey(t){ const c = TL.latest && t > TL.latest ? TL.latest : t; return iso(Math.floor(c/600e3)*600e3); }
function radarKey(t){

    if (!TL.rv) return null;

    return f ? "rv:" + f.path : null;

function makeLayer(type, key){

function ensureLayer(type, key){

const PLAY_ICON = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>', PAUSE_ICON = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

function showOnMap(kind, i){
  if (kind==="airport"){ kind = "ap"; i = DATA.airports[i].icao; }
  if (kind==="ap"){ const a = apOf(i); MAP.sel = {kind:"ap", icao:i}; MAP.view = {c:[a.lat,a.lon], z:8}; }
  else { MAP.sel = {kind, i}; const x = DATA.mro[i]; MAP.view = {c:[x.lat,x.lon], z:7}; }
  go("map");
}
function panel(title, sub, code, body){
  const p = $("#mpanel"); if (!p) return;
  p.hidden = false;
  p.innerHTML = `<header>${code?`<span class="cc icao" style="width:52px;height:34px">${esc(code)}</span>`:""}<div style="min-width:0"><h3>${esc(title)}</h3><div class="muted small">${esc(sub)}</div></div>
  <button class="x" onclick="closePanel()" aria-label="Close">${svg("x")}</button></header><div class="body">${body}</div>`;
}
function closePanel(){ const p=$("#mpanel"); if(p){p.hidden=true;p.innerHTML="";} markSel(null); if (MAP.pt){ MAP.map?.removeLayer(MAP.pt); MAP.pt=null; } MAP.sel=null; }
function wxBlocks(a){
  return MAP.live ? `<div class="block"><h3>Latest METAR</h3><div id="wx-metar"><span class="muted small">Loading…</span></div></div>
    <div class="block"><h3>Survey weather · past 6 days and next 3</h3><div id="wx-fc"><span class="muted small">Loading…</span></div></div>`
    : `<div class="block"><h3>METAR and 3-day forecast</h3>${wxFallback(a.lat,a.lon,a.icao)}</div>`;
}
function selectAirport(icao){
  const a = apOf(icao); if (!a) return;
  if (MAP.pt){ MAP.map.removeLayer(MAP.pt); MAP.pt=null; }
  MAP.sel = {kind:"ap", icao};
  if (!MAP.ap.has(icao)) placeAirports();
  markSel("ap:"+icao);
  const c = a.cur!=null ? DATA.airports[a.cur] : null;
  panel(c ? c.name : a.name, [a.city, a.country].filter(Boolean).join(", "), icao, `
    ${apFacts(a)}
    ${c ? `<dl class="facts-grid"><div><dt>Fuel</dt><dd>${esc((c.fuel||["—"]).join(", "))}</dd></div><div><dt>Hours</dt><dd>${esc(c.hours)}</dd></div>
      <div><dt>Customs</dt><dd>${c.customs?"Yes":"Not confirmed"}</dd></div><div><dt>Hangar</dt><dd>${esc(c.hangar||"Not confirmed")}</dd></div></dl>
      <div class="block"><h3>FBO &amp; handling</h3><p class="small">${esc(c.handler)}</p>${c.ppr?`<p class="small muted" style="margin-top:4px">PPR: ${esc(c.ppr)}</p>`:""}
        <div class="actions" style="margin-top:8px"><a class="btn sm quiet" href="${c.handlerUrl}" target="_blank" rel="noopener">Handler ↗</a><button class="btn sm ghost" data-open="airport:${a.cur}">Full card</button></div></div>`
      : `<div class="block"><h3>FBO &amp; handling</h3><p class="small muted">Not in the EAASI directory yet.</p><div class="actions" style="margin-top:8px"><button class="btn sm quiet" data-open="ap:${icao}">Add handling info</button></div></div>`}
    ${wxBlocks(a)}`);
  if (MAP.live){ loadMetar(icao); loadForecast(a.lat, a.lon); }
}
function selectFeature(kind, i){
  if (kind==="airport") return selectAirport(DATA.airports[i].icao);
  if (MAP.pt){ MAP.map.removeLayer(MAP.pt); MAP.pt=null; }
  MAP.sel = {kind, i}; markSel(kind+":"+i);
  const x = DATA.mro[i];
  panel(x.name, [x.city,x.country].filter(Boolean).join(", "), ccOf(x.country), `
    <dl class="facts-grid"><div><dt>Approvals</dt><dd>${esc(x.approvals.join(" · ")||"Not published")}</dd></div><div><dt>Types</dt><dd>${esc(x.types.join(", ")||"—")}</dd></div></dl>
    ${x.mods?`<div class="block"><h3>Survey work</h3><p class="small">${esc(x.mods)}</p></div>`:""}
    <p class="muted small">Pin placed at the company's city or home airfield.</p>
    <div class="actions"><button class="btn sm" data-open="mro:${i}">Full card</button><a class="btn sm quiet" href="${x.url}" target="_blank" rel="noopener">Website ↗</a></div>`);
}
function nearest(lat, lon, n){
  const R=3440.1, rad=Math.PI/180;
  return AP.map(a=>{ const dφ=(a.lat-lat)*rad, dλ=(a.lon-lon)*rad; const h=Math.sin(dφ/2)**2+Math.cos(lat*rad)*Math.cos(a.lat*rad)*Math.sin(dλ/2)**2; return {a,d:2*R*Math.asin(Math.sqrt(h))}; }).sort((x,y)=>x.d-y.d).slice(0,n);
}
function selectPoint(lat, lon){
  markSel(null); MAP.sel = {kind:"point", lat, lon};
  if (MAP.pt) MAP.map.removeLayer(MAP.pt);
  MAP.pt = L.marker([lat,lon], {icon:L.divIcon({className:"",html:'<span class="ptpin"></span>',iconSize:[0,0]}), interactive:false}).addTo(MAP.map);
  const nb = nearest(lat, lon, 5);
  panel("Survey block", `${lat.toFixed(3)}°, ${lon.toFixed(3)}°`, "", `
    <div class="block"><h3>Survey weather · past 6 days and next 3</h3><div id="wx-fc">${MAP.live?`<span class="muted small">Loading…</span>`:wxFallback(lat,lon)}</div></div>
    <div class="block"><h3>Nearest airports</h3><div class="near">${nb.map(({a,d})=>`<button onclick="selectAirport('${a.icao}')"><span class="pin ${a.cur!=null?"":"alt"}" style="transform:none">${a.icao}</span><span style="flex:1;min-width:0">${esc(a.cur!=null?DATA.airports[a.cur].name:a.name)}<span class="muted small" style="display:block">${a.rwy?fmtN(a.rwy)+" m runway":""}${a.cur!=null?" · EAASI directory":""}</span></span><span class="muted small num">${Math.round(d)} NM</span></button>`).join("")}</div></div>`);
  if (MAP.live) loadForecast(lat, lon);
}
function wxFallback(lat, lon, icao){
  return `<p class="small muted" style="margin-bottom:8px">${LIVE_HINT}</p><div class="actions">
    ${icao?`<a class="btn sm quiet" href="https://aviationweather.gov/data/metar/?ids=${icao}&taf=1" target="_blank" rel="noopener">METAR/TAF ↗</a>`:""}
    <a class="btn sm quiet" href="https://www.windy.com/?clouds,${lat.toFixed(3)},${lon.toFixed(3)},8" target="_blank" rel="noopener">Clouds on Windy ↗</a>
    <a class="btn sm quiet" href="https://www.rainviewer.com/map.html?loc=${lat.toFixed(3)},${lon.toFixed(3)},8" target="_blank" rel="noopener">Rain radar ↗</a></div>`;
}
async function getJSON(url){
  if (MAP.cache[url] && Date.now()-MAP.cache[url].t < 10*60e3) return MAP.cache[url].v;
  const r = await fetch(url); if (!r.ok) throw new Error(r.status);
  const v = await r.json(); MAP.cache[url] = {t:Date.now(), v}; return v;
}
async function loadMetar(icao){
  const el = () => $("#wx-metar");
  try{
    const j = await getJSON(`https://aviationweather.gov/api/data/metar?ids=${icao}&format=json&taf=true`);
    const m = j && j[0]; if (!el()) return;
    if (!m){ el().innerHTML = `<p class="small muted">No recent METAR for ${icao}.</p>`; return; }
    const obs = new Date((m.obsTime||0)*1000);
    el().innerHTML = `<div class="actions" style="margin-bottom:6px;align-items:center">${m.fltCat?`<span class="fltcat ${m.fltCat}">${m.fltCat}</span>`:""}<span class="small muted">Observed ${obs.toISOString().slice(11,16)}Z · ${ago(obs)}</span></div>
      <div class="metar">${esc(m.rawOb)}</div>${m.rawTaf?`<details style="margin-top:8px"><summary class="small" style="cursor:pointer;color:var(--teal-ink);font-weight:700">TAF</summary><div class="metar" style="margin-top:6px">${esc(m.rawTaf)}</div></details>`:""}
      <p class="muted small" style="margin-top:6px">Source: aviationweather.gov</p>`;
  }catch(e){ if (el()) el().innerHTML = `<p class="small muted" style="margin-bottom:6px">METAR could not be loaded.</p>`+wxFallback(0,0,icao).replace(/<a class="btn sm quiet" href="https:\/\/www\.(windy|rainviewer)[^]*?<\/a>/g,""); }
}
function cloudColor(c){ return c < 25 ? css("--ok") : c < 60 ? css("--warn") : css("--bad"); }
function dayStats(H, D, di){
  const t = D.time[di];
  const idx = H.time.map((h,k)=>k).filter(k=>H.time[k].startsWith(t));
  const dayH = idx.filter(k=>H.is_day[k]===1);
  return {t, clear:dayH.filter(k=>H.cloud_cover[k] < 25).length, dayLen:dayH.length, cloud:D.cloud_cover_mean?.[di], rain:D.precipitation_sum[di], wind:D.wind_speed_10m_max[di], tmax:D.temperature_2m_max[di]};
}
const clearCls = n => n>=4 ? "good" : n>=1 ? "some" : "none";
const dayName = (t, o) => new Date(t+"T12:00").toLocaleDateString("en-GB", o);
async function loadForecast(lat, lon){
  const el = () => $("#wx-fc");
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&hourly=cloud_cover,cloud_cover_low,is_day&daily=cloud_cover_mean,precipitation_sum,wind_speed_10m_max,temperature_2m_max&past_days=6&forecast_days=3&timezone=auto&wind_speed_unit=kn`;
  try{
    const j = await getJSON(url); if (!el()) return;
    const H = j.hourly, D = j.daily, nPast = Math.max(0, D.time.length - 3);
    const past = D.time.slice(0, nPast).map((t,di) => dayStats(H, D, di));
    const days = D.time.slice(nPast).map((t,di) => dayStats(H, D, nPast+di));
    const h0 = Math.max(0, H.time.findIndex(h => h.startsWith(D.time[nPast])));
    const bars = H.cloud_cover.slice(h0, h0+72).map((c,k)=>`<i class="${H.is_day[h0+k]?"":"night"}" style="height:${Math.max(8,c)}%;background:${cloudColor(c)}" title="${H.time[h0+k].replace("T"," ")} · cloud ${c}% · low ${H.cloud_cover_low[h0+k]}%"></i>`).join("");
    el().innerHTML = `<div class="days">${days.map(d=>`<div class="day"><b>${dayName(d.t,{weekday:"short",day:"numeric"})}</b>
        <span class="clear num ${clearCls(d.clear)}">${d.clear} h</span><span class="muted">clear daylight</span>
        <span class="num">cloud ${d.cloud ?? "—"}% · ${d.rain} mm</span><span class="num muted">wind ${Math.round(d.wind)} kt · ${Math.round(d.tmax)}°</span></div>`).join("")}</div>
      <div style="margin-top:10px"><div class="strip" aria-label="Hourly cloud cover for 72 hours">${bars}</div>
      <div class="striplab"><span>today 00 h</span><span>+24 h</span><span>+48 h</span><span>+72 h</span></div></div>
      <div class="legend" style="margin-top:6px"><span><span class="key" style="background:var(--ok)"></span> under 25% cloud</span><span><span class="key" style="background:var(--warn)"></span> 25–60%</span><span><span class="key" style="background:var(--bad)"></span> over 60%</span><span>faded = night</span></div>
      ${past.length ? `<h3 style="margin:14px 0 6px;font-size:.88rem">Past ${past.length} days</h3>
      <div class="pastdays">${past.map(d=>`<div><b>${dayName(d.t,{weekday:"short"})} ${dayName(d.t,{day:"numeric"})}</b><span class="c num ${clearCls(d.clear)}">${d.clear} h</span><span class="muted num">${d.rain} mm</span></div>`).join("")}</div>
      <p class="muted small" style="margin-top:4px">Clear daylight hours and rain per day, from the weather model's analysis. Useful to see whether a block could have been flown.</p>` : ""}
      <p class="muted small" style="margin-top:6px">Clear daylight = daylight hours with total cloud under 25%. Forecast: Open-Meteo.</p>`;
  }catch(e){ if (el()) el().innerHTML = `<p class="small muted" style="margin-bottom:6px">Forecast could not be loaded.</p>`+wxFallback(lat,lon); }
}

/* ---------- render ---------- */
function render(){
  renderNav();
  const m = $("#main");
  if (MAP.map && S.view!=="map"){ MAP.map.remove(); MAP.map=null; }
  m.innerHTML = S.view==="home" ? renderHome() : S.view==="permits" ? renderPermits() : S.view==="map" ? renderMap() : S.view==="dir" ? renderDir() : S.view==="radar" ? renderRadar() : renderChat();
  const q = $("#q");
  if (q) q.addEventListener("input", e => { S.q = e.target.value; const pos=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); });
  if (S.view==="chat"){ updateMode(); paintChat(); }
  if (S.view==="map") initMap();
}
const hash = (location.hash||"").slice(1);
if (["home","permits","map","dir","radar","chat"].includes(hash)) S.view = hash;
render();
</script>
